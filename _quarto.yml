project:
  type: website
  render:
    - "**/*.qmd"
  # Copied unchanged to the site root. The Google file verifies the site in Search Console:
  # never delete or rename it.
  resources:
    - google39c2dc10e6d68f15.html
    - robots.txt

lang: en-GB

website:
  title: "William E. Echeverría Tigse"
  description: "Academic website of William E. Echeverría Tigse, PhD researcher in Economics and Finance at the University of Coimbra and the University of Minho."
  site-url: https://williamecheverriat.github.io
  # Default preview image and card when a page is shared (Facebook, LinkedIn, X, etc.).
  image: images/profile.jpg
  image-alt: "Portrait of William E. Echeverría Tigse"
  open-graph:
    locale: en_GB
  twitter-card:
    card-style: summary
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: talks.qmd
        text: Conferences
      - href: teaching.qmd
        text: Teaching
      - href: cv.qmd
        text: CV
      - href: blog.qmd
        text: Blog
    right:
      - icon: envelope
        href: mailto:echeverriatigse@uc.pt
        aria-label: Email
      - icon: linkedin
        href: https://www.linkedin.com/in/william-echeverr%C3%ADa-299116215/
        aria-label: LinkedIn
      - icon: mortarboard
        href: https://scholar.google.com/citations?user=X_U8qbwAAAAJ
        aria-label: Google Scholar
      # Academicons shortcode (Bootstrap Icons has no ORCID icon); the hidden text is the link's accessible name.
      - text: '{{< ai orcid >}}<span class="visually-hidden">ORCID</span>'
        href: https://orcid.org/0000-0003-3152-1012
      - icon: github
        href: https://github.com/williamecheverriat
        aria-label: GitHub

format:
  html:
    theme:
      - cosmo
      - brand
      - styles.scss
    toc: false

execute:
  freeze: auto
